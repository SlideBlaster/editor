<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SlideBlaster</title>
  </head>
  <body>
    <div id="app">
      <header class="app-bar">
        <span class="app-name">SlideBlaster</span>
        <span class="app-doc" id="doc-title"></span>
        <span class="app-tag">web-shell &middot; M2</span>
      </header>
      <main class="workspace">
        <section class="editor">
          <div class="editor-head">sample.slideBlaster.md</div>
          <div class="code-host" id="code"></div>
        </section>
        <section class="preview">
          <div class="stage-wrap">
            <div class="stage" id="stage"></div>
          </div>
          <div class="parse-error" id="error" hidden></div>
          <nav class="filmstrip" id="filmstrip"></nav>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
