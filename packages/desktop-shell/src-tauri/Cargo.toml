[package]
name = "slideblaster-desktop"
version = "0.0.0"
description = "SlideBlaster desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Tauri app logic lives in the lib so it can be shared with a future mobile
# entry point; main.rs is a thin binary that calls into it.
name = "slideblaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
