[package]
name = "slideblaster-desktop"
version = "0.0.0"
description = "SlideBlaster desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Tauri app logic lives in the lib so it can be shared with a future mobile
# entry point; main.rs is a thin binary that calls into it.
name = "slideblaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The self-updater is desktop-only (no mobile updater target).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
