name: Deploy

# Continuous deployment of the web shell to Cloudflare Pages (ADR 0020).
# Approach A: build in a GitHub Actions runner, then upload the static output with
# Wrangler (Pages Direct Upload). This keeps full control of the pnpm-workspace
# build and the latexml engine fetch (make build pulls the ~21 MB WASM runtime from
# the engine-v1 GitHub Release), in one pipeline alongside the Workers. Runbook +
# account setup: infra/README.md, infra/cloudflare.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The exact CI checks must pass on a clean checkout before anything ships.
  # Stays skipped until Cloudflare is wired: set repo variable DEPLOY_PAGES=true.
  gate:
    if: ${{ vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make check

  deploy-pages:
    needs: gate
    if: ${{ vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web shell
        run: make build
        env:
          # Unset -> the shell uses the offline DevAuthAdapter (works with no backend).
          # When the auth Worker + custom domain are live, set these as GitHub repo
          # Variables (Settings > Secrets and variables > Actions > Variables):
          #   VITE_SB_AUTH_URL  = /                             (same-origin auth Worker)
          #   VITE_SB_GIT_PROXY = https://git.slideblaster.app
          VITE_SB_AUTH_URL: ${{ vars.VITE_SB_AUTH_URL }}
          VITE_SB_GIT_PROXY: ${{ vars.VITE_SB_GIT_PROXY }}
      - name: Deploy to Cloudflare Pages
        working-directory: packages/web-shell
        # wrangler-action installs wrangler with `npm i`, which fails on this repo's
        # workspace:* deps (EUNSUPPORTEDPROTOCOL). Run wrangler via pnpm dlx instead;
        # output dir + project name come from wrangler.toml, --branch=main = production.
        run: pnpm dlx wrangler@3.90.0 pages deploy --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
