<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SlideBlaster</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;font:16px system-ui;background:#f4f5f8;color:#1b1e28}
button{font:inherit;padding:.5rem 1rem;border:1px solid #c9ccd6;border-radius:6px;background:#fff;cursor:pointer;margin-top:1rem}
#msg{color:#6b7180}</style></head>
<body><main style="text-align:center"><h1>SlideBlaster</h1><p id="msg">Starting sb serve&hellip;</p>
<button id="open" hidden>Open folder&hellip;</button></main>
<script>
const invoke = window.__TAURI__.core.invoke;
const msg = document.getElementById("msg"), open = document.getElementById("open");
open.onclick = () => invoke("open_folder_dialog");
window.__TAURI__.event.listen("sb-status", (e) => { msg.textContent = e.payload; open.hidden = !/Choose|failed/.test(e.payload); });
invoke("shell_ready");
</script></body></html>
